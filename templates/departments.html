{% extends "base.html" %}

{% block content %}

<div class="container mt-4">

<h2>Departments</h2>

<form method="GET">

<div class="row mb-3">

<div class="col-md-6">

<input
type="text"
name="search"
class="form-control"
placeholder="Search Department">

</div>

<div class="col-md-2">

<button class="btn btn-primary">
Search
</button>

</div>

<div class="col-md-4 text-end">

<a
href="{{ url_for('add_department') }}"
class="btn btn-success">

Add Department

</a>

</div>

</div>

</form>

<table class="table table-bordered table-hover">

<thead class="table-dark">

<tr>

<th>ID</th>

<th>Name</th>

<th>Action</th>

</tr>

</thead>

<tbody>

{% for department in departments %}

<tr>

<td>{{ department.id }}</td>

<td>{{ department.name }}</td>

<td>

<a
href="{{ url_for('edit_department', id=department.id) }}"
class="btn btn-warning btn-sm">

Edit

</a>

<a
href="{{ url_for('delete_department', id=department.id) }}"
class="btn btn-danger btn-sm"
onclick="return confirm('Delete Department?')">

Delete

</a>

</td>

</tr>

{% endfor %}

</tbody>

</table>

</div>

{% endblock %}
