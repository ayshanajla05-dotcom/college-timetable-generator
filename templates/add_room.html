{% extends "base.html" %}

{% block content %}

<div class="container mt-4">

<h2>Add Room</h2>

<form method="POST">

<input
class="form-control mb-3"
name="room_number"
placeholder="Room Number">

<select
class="form-select mb-3"
name="room_type">

<option>Classroom</option>

<option>Lab</option>

</select>

<input
class="form-control mb-3"
type="number"
name="capacity"
placeholder="Capacity">

<button class="btn btn-success">

Save

</button>

</form>

</div>

{% endblock %}
