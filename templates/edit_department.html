{% extends "base.html" %}

{% block content %}

<div class="container mt-4">

<h2>Edit Department</h2>

<form method="POST">

<div class="mb-3">

<label>Department Name</label>

<input
type="text"
name="name"
value="{{ department.name }}"
class="form-control"
required>

</div>

<button class="btn btn-primary">

Update

</button>

<a
href="{{ url_for('departments') }}"
class="btn btn-secondary">

Cancel

</a>

</form>

</div>

{% endblock %}
