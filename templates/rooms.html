{% extends "base.html" %}

{% block content %}

<div class="container mt-4">

<h2>Room Management</h2>

<a href="{{ url_for('add_room') }}"
class="btn btn-success mb-3">

Add Room

</a>

<table class="table table-bordered">

<thead>

<tr>

<th>Room</th>

<th>Type</th>

<th>Capacity</th>

</tr>

</thead>

<tbody>

{% for room in rooms %}

<tr>

<td>{{ room.room_number }}</td>

<td>{{ room.room_type }}</td>

<td>{{ room.capacity }}</td>

</tr>

{% endfor %}

</tbody>

</table>

</div>

{% endblock %}
